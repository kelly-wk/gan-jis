[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gan-jis-audited-reproduction"
version = "0.1.0"
description = "Audited reproduction utilities for JIS-constrained steel-section candidate generation"
requires-python = ">=3.10"
dependencies = ["numpy==2.1.3", "torch==2.5.1"]

[tool.setuptools.packages.find]
where = ["src"]
